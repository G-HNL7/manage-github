repositories:
  manage-github:
    description: GitHub Platform managed with Terraform
    visibility: public
    auto_init: true
    has_issues: true
    has_projects: false
    has_wiki: false
    allow_merge_commit: false
    allow_squash_merge: true
    allow_rebase_merge: false
    delete_branch_on_merge: true
    archived: false
    gitignore_template: Terraform
    license_template: apache-2.0
    topics:
      - terraform
      - github
      - manage-github
      - infra

    labels: enterprise
