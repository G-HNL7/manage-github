rulesets:
  enterprise:
    target: branch
    enforcement: active
    conditions:
      include:
        - "~DEFAULT_BRANCH"
      exclude: []

rulesets_rules:
  default:
    rules:
      deletion: true
      non_fast_forward: true
      required_linear_history: true
      pull_request:
        dismiss_stale_reviews_on_push: true
        require_code_owner_review: true
        required_approving_review_count: 1
      required_status_checks:
        strict: true
        contexts: []
  terraform-checks:
    rules:
      required_status_checks:
        strict: true
        contexts:
          - terraform-fmt
          - terraform-validate
          - terraform-tflint
          - terraform-checkov
          - terraform-trivy
          - terraform-test
  security-critical:
    rules:
      pull_request:
        required_approving_review_count: 2
      required_status_checks:
        strict: true
        contexts:
          - secret-scanning
          - dependency-review
          - codeql
          - trivy
          - sonarqube
